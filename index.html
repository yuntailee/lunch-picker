<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f97316" />
    <title>午餐吃什麼</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <aside class="panel">
        <h1><span class="icon icon-bowl-food" aria-hidden="true"></span> 午餐吃什麼</h1>

        <section>
          <h2>地點</h2>
          <div id="locations" class="chips"></div>
          <form id="location-form" class="keyword-form">
            <input id="location-input" type="search" placeholder="或輸入地址、地標，例如 台北101" enterkeyhint="go" />
            <button type="submit" class="chip">設定</button>
          </form>
        </section>

        <section>
          <h2>來源</h2>
          <div id="modes" class="chips"></div>
        </section>

        <section>
          <h2>想吃</h2>
          <div id="tags" class="chips"></div>
          <form id="keyword-form" class="keyword-form" hidden>
            <input id="keyword" type="search" placeholder="或輸入想吃的，例如 披薩" enterkeyhint="search" />
            <button type="submit" class="chip">搜尋</button>
          </form>
        </section>

        <section>
          <h2>預算（每人）</h2>
          <div id="prices" class="chips"></div>
        </section>

        <button id="random" type="button" class="random"><span class="icon icon-dice-five" aria-hidden="true"></span> 隨機挑一間</button>

        <div id="result" class="result" hidden aria-live="polite"></div>
      </aside>

      <section class="results">
        <h2 id="count"></h2>
        <ul id="list" class="list"></ul>
      </section>
    </main>
    <iframe id="preview" class="preview" title="Google 地圖預覽" hidden></iframe>

    <button id="chat-toggle" type="button" class="chat-toggle" aria-label="開啟午餐小幫手">
      <span class="icon icon-chat-circle-dots" aria-hidden="true"></span>
    </button>
    <section id="chat" class="chat" aria-label="午餐小幫手" hidden>
      <header class="chat-header">
        <span class="chat-avatar"><span class="icon icon-bowl-food" aria-hidden="true"></span></span>
        <div>
          <p class="chat-title">午餐小幫手</p>
          <p class="chat-status">Gemini · 從目前列表推薦</p>
        </div>
        <button id="chat-close" type="button" class="chat-close" aria-label="關閉">
          <span class="icon icon-x" aria-hidden="true"></span>
        </button>
      </header>
      <ol id="chat-messages" class="chat-messages" aria-live="polite"></ol>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="傳送訊息…" autocomplete="off" enterkeyhint="send" />
        <button type="submit" class="chat-send" aria-label="送出">
          <span class="icon icon-paper-plane-right" aria-hidden="true"></span>
        </button>
      </form>
    </section>
    <script type="module" src="app.js"></script>
  </body>
</html>
