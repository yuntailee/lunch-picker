<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f97316" />
    <title>午餐吃什麼</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1><span class="icon icon-bowl-food" aria-hidden="true"></span> 午餐吃什麼</h1>
      <div id="user" class="user" hidden>
        <button id="admin-open" type="button" class="chip small" hidden>管理帳號</button>
        <div class="account">
          <button type="button" class="account-name">
            <span class="icon icon-user-circle" aria-hidden="true"></span> <span id="user-name"></span>
          </button>
          <div class="account-menu">
            <button id="logout" type="button" class="chip small">登出</button>
          </div>
        </div>
      </div>
    </header>

    <form id="login" class="login" hidden>
      <label for="login-name">輸入英文姓名登入</label>
      <input id="login-name" type="text" autocomplete="username" autocapitalize="words" enterkeyhint="go" required />
      <button type="submit" class="random">登入</button>
      <p id="login-error" class="login-error" aria-live="polite"></p>
    </form>

    <main hidden>
      <aside class="panel">
        <section>
          <h2>地點</h2>
          <div id="locations" class="chips"></div>
          <form id="location-form" class="keyword-form">
            <input id="location-input" type="search" placeholder="或輸入地址、地標，例如 台北101" enterkeyhint="go" />
            <button type="submit" class="chip">設定</button>
          </form>
        </section>

        <section>
          <h2>來源</h2>
          <div id="modes" class="chips"></div>
        </section>

        <section>
          <h2>
            <button id="tags-switch" class="switch" type="button" role="switch">想吃</button>
          </h2>
          <div id="tags" class="chips"></div>
          <form id="keyword-form" class="keyword-form" hidden>
            <input id="keyword" type="search" placeholder="或輸入想吃的，例如 披薩" enterkeyhint="search" />
            <button type="submit" class="chip">搜尋</button>
          </form>
        </section>

        <section>
          <h2>預算（每人）</h2>
          <div id="prices" class="chips"></div>
        </section>

        <button id="random" type="button" class="random"><span class="icon icon-dice-five" aria-hidden="true"></span> 隨機挑一間</button>
        <button id="blacklist-open" type="button" class="blacklist-link"></button>

        <div id="result" class="result" hidden aria-live="polite"></div>
      </aside>

      <section class="results">
        <h2 id="count"></h2>
        <ul id="list" class="list"></ul>
      </section>
    </main>
    <iframe id="preview" class="preview" title="Google 地圖預覽" hidden></iframe>
    <div id="context-menu" class="context-menu" role="menu" hidden></div>

    <dialog id="admin" class="admin" aria-labelledby="admin-title">
      <h2 id="admin-title">管理帳號</h2>
      <ul id="admin-list" class="admin-list"></ul>
      <form id="admin-add" class="keyword-form">
        <input id="admin-name" type="text" placeholder="新成員英文姓名" autocomplete="off" />
        <button type="submit" class="chip">新增</button>
      </form>
      <label class="admin-token">
        GitHub token（只存在這台瀏覽器）
        <input id="admin-token" type="password" autocomplete="off" />
      </label>
      <p id="admin-status" class="tags" aria-live="polite"></p>
      <div class="admin-actions">
        <button id="admin-close" type="button" class="chip">關閉</button>
        <button id="admin-save" type="button" class="chip primary">儲存</button>
      </div>
    </dialog>
    <script type="module" src="app.js"></script>
  </body>
</html>
